{{- $alt := .PlainText -}}
{{- $caption := .Text -}}
{{- $source := .Destination -}}
{{- with .Page.Resources.Get .Destination -}}
{{- $source = .Permalink -}}
{{- end -}}
<figure>
  <img src="{{ $source | safeURL }}" alt="{{ $alt }}"{{ with .Title }} title="{{ . }}"{{ end }}>
  {{ with $caption }}
  <figcaption>{{ . | safeHTML }}</figcaption>
  {{ end }}
</figure>
